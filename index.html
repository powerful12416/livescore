<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;color:#000;font-family:Arial;font-size:13px}
.header{background:#fff;padding:10px;border-bottom:2px solid #000;font-weight:900}
.match-head{background:#006600;color:#fff;padding:6px 10px;font-weight:900}
.score-box{padding:10px;border-bottom:1px solid #ddd}
.ads{display:flex;gap:8px;padding:8px;overflow-x:auto;background:#f5f5f5}
.ad-card{min-width:130px;background:#e6f2ff;border:1px solid #c5d9f0;border-radius:6px;padding:8px;font-size:11px}
.tabs{padding:8px;border-bottom:1px solid #000}
.tabs a{color:#0000cc;text-decoration:underline;font-weight:700}
.section-head{background:#000;color:#fff;padding:5px 10px;font-weight:900}
</style></head><body>
<div class="header">⚡ FLASHSCORE</div>
<a href="/" style="padding:8px;display:block;color:#0000cc">REFRESH NOW</a>
<div class="match-head" id="mh">Loading...</div>
<div class="score-box" id="sb"></div>
<div class="ads"><div class="ad-card"><a href="#">50% stake back as Freebet on UCL</a></div><div class="ad-card">🎁 <a href="#">1XBET: 300% deposit bonus...</a></div><div class="ad-card">🎁 <a href="#">BETANO Bonus up to ₦200k</a></div></div>
<div class="tabs"><a href="#">Summary</a> | <a href="#">Lineups</a> | <a href="#">Stats</a> | <a href="#">H2H</a></div>
<div class="section-head">1st Half</div><div id="events" style="padding:8px">Loading HT/FT data...</div>
<script>
const p=new URLSearchParams(location.search);
try{
  const m=JSON.parse(decodeURIComponent(p.get('data')||'{}'));
  const home=m.home?.name||m.home_name||'Everton';
  const away=m.away?.name||m.away_name||'Chelsea';
  const hs=m.home_score??m.home?.score??0, as=m.away_score??m.away?.score??0;
  const hhs=m.home_score_ht??0, ahs=m.away_score_ht??0;
  document.getElementById('mh').innerText=home+' - '+away;
  document.getElementById('sb').innerHTML=`<b>${hs}-${as} (${hhs}-${ahs})</b><br>${m.status||'Half Time'}<br>${p.get('date')||''} 13:30`;
  document.getElementById('events').innerHTML=`FT: ${hs}-${as}<br>HT: ${hhs}-${ahs}<br><br>${home} vs ${away} stats loading...`;
}catch(e){
  document.getElementById('mh').innerText='Everton - Chelsea';
  document.getElementById('sb').innerHTML='<b>0-0 (0-0)</b><br>Half Time<br>17.10.2026 13:30';
}
</script></body></html>
