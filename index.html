<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore 904 - Live Football Scores</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0f1214;color:#fff}
header{background:#1a1e21;padding:12px 16px;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2f33;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px}.logo span{color:#ff3b30}
#clock{font-size:11px;color:#888}
.tabs{display:flex;gap:8px;padding:12px;background:#161a1d}
.tabs button{background:#23282c;color:#888;border:none;padding:8px 16px;border-radius:20px;font-size:13px}
.tabs button.active{background:#ff3b30;color:#fff}
#content{padding:8px}
.match{background:#1e2225;margin-bottom:8px;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.team{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.score{font-weight:800;color:#ff3b30;min-width:70px;text-align:center}
.league{background:#23282c;padding:8px 12px;margin:12px 0 4px;border-radius:6px;font-size:12px;color:#aaa}
.status{font-size:10px;color:#666}
.live{color:#00ff88!important;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
</style>
</head>
<body>
<header>
<div class="logo">LiveScore <span>904</span></div>
<div id="clock">--:-- WAT</div>
</header>
<div class="tabs">
<button class="active" onclick="load('live')">Live</button>
<button onclick="load('today')">Today</button>
<button onclick="load('results')">Results</button>
</div>
<div id="content">Loading...</div>
<script>
const WAT='Africa/Lagos';
function fmtTime(d){return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:WAT})+' WAT'}
async function load(type){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 const c=document.getElementById('content');
 c.innerHTML='Loading...';
 try{
  const r=await fetch('/api/matches?v='+Date.now());
  const matches=await r.json();
  if(!matches.length){c.innerHTML='<div style="text-align:center;padding:40px;color:#666">No matches today<br>Check later</div>';return;}
  let html=''; let lastLeague='';
  matches.forEach(m=>{
   const league=m.league?.name || m.competition || 'Match';
   if(league!==lastLeague){html+=`<div class="league">${league}</div>`;lastLeague=league;}
   const home=m.home_team?.name || m.homeTeam?.name || m.home_team || 'Home';
   const away=m.away_team?.name || m.awayTeam?.name || m.away_team || 'Away';
   const hs=m.home_score ?? m.scores?.home ?? m.score?.home ?? '-';
   const as=m.away_score ?? m.scores?.away ?? m.score?.away ?? '-';
   const status=m.status || m.state || '';
   const isLive=status.toLowerCase().includes('live')||status.includes('1H')||status.includes('2H');
   html+=`<div class="match"><div class="team">${home}</div><div class="score">${hs} - ${as}<div class="status ${isLive?'live':''}">${isLive?'LIVE '+ (m.minute||'') : fmtTime(m.date||m.kickoff||m.start_time)}</div></div><div class="team" style="text-align:right">${away}</div></div>`;
  });
  c.innerHTML=html;
 }catch(e){c.innerHTML='Error loading: '+e.message}
}
load('live');
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:WAT,hour:'2-digit',minute:'2-digit'})+' WAT'},1000);
setInterval(()=>load('live'),30000);
</script>
</body>
</html>
