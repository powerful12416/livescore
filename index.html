<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LiveScore France Time</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e1117;color:#fff;font-family:system-ui}
.top{padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#0e1117;z-index:10;border-bottom:1px solid #1f242f}
.tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:#0e1117;position:sticky;top:53px;z-index:9}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 18px;border-radius:20px;background:#1e222b;color:#8b8f99;border:none;font-weight:600;font-size:14px;cursor:pointer}
.tab.active{background:#1fd464;color:#000}
.tab-drop{padding:8px 12px;border-radius:20px;background:#1e222b;color:#8b8f99;border:none}
.filters{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.filters::-webkit-scrollbar{display:none}
.f{white-space:nowrap;padding:7px 14px;border-radius:8px;background:#1e222b;color:#8b8f99;border:1px solid #2a303f;font-size:13px;font-weight:600;cursor:pointer}
.f.active{background:#fff;color:#000}
.search{margin:8px 16px;background:#1a1f2b;border-radius:10px;display:flex;align-items:center;padding:10px 14px;gap:8px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:14px}
.league-head{background:#151a25;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-top:1px solid #1f242f}
.league-head .l{font-size:12px;font-weight:700}
.league-head .l .country{color:#fff}
.league-head .l .lname{color:#1fd464}
.league-head span{font-size:11px;color:#1fd464;font-weight:600}
.match-row{display:flex;align-items:center;padding:12px 16px;background:#0e1117;border-bottom:1px solid #1a1f2b;cursor:pointer}
.match-row:active{background:#1a1f2b}
.time{width:56px;font-size:12px;color:#8b8f99;font-weight:700}
.time.live{color:#ff3b30}
.teams{flex:1;font-size:14px;line-height:20px}
.score{width:60px;text-align:right;font-weight:800;font-size:14px}
.score.live{color:#1fd464}
.score.finished{color:#fff}
.dot{width:6px;height:6px;background:#ff3b30;border-radius:50%;display:inline-block;margin-right:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.modal{position:fixed;inset:0;background:#0e1117;z-index:100;padding:16px;overflow:auto;display:none}
.modal.show{display:block}
</style>
</head>
<body>
<div class="top">
<span onclick="history.back()" style="font-size:22px;cursor:pointer">←</span>
<div><h1 id="dateHead">Oct 17, 2026</h1><small id="timeHead">France Time - Europe/Paris</small></div>
</div>
<div class="tabs" id="dayTabs"></div>
<div class="filters">
<button class="f active" data-f="all" onclick="setFilter('all')">All</button>
<button class="f" data-f="live" onclick="setFilter('live')">Live</button>
<button class="f" data-f="finished" onclick="setFilter('finished')">Finished</button>
<button class="f" data-f="scheduled" onclick="setFilter('scheduled')">Scheduled</button>
<button class="f" onclick="loadMatches(currentDate)">↻ Refresh</button>
</div>
<div class="search"><span>🔍</span><input id="q" placeholder="Search team, league..." oninput="render()"></div>
<div id="list"></div>
<div id="modal" class="modal" onclick="this.classList.remove('show')">
<div style="display:flex;justify-content:space-between"><b id="mTitle"></b><span>✕</span></div>
<div id="mBody" style="margin-top:20px"></div>
</div>

<script>
let allMatches=[], currentFilter='all', currentDate=new Date().toISOString().split('T')[0];
const TOP = ['Champions League','Premier League','La Liga','Serie A','Bundesliga','Ligue 1','Europa League','ENGLAND:','SPAIN:','FRANCE:','ITALY:','GERMANY:','NETHERLANDS:'];
function getPrio(name){ for(let i=0;i<TOP.length;i++) if(name.toUpperCase().includes(TOP[i].toUpperCase())) return i; return 999; }

// *** FRANCE TIME CORRECT - EUROPE/PARIS ***
function toFranceTime(timeStr, dateStr){
  try{
    if(!timeStr) return '--:--';
    // Clean time - can be "16:15" or "16:15:00" or ISO
    let t = timeStr.toString().split('T').pop().substring(0,5);
    if(!t.includes(':')) return timeStr;
    let [hh,mm] = t.split(':').map(Number);
    // Build UTC date then convert to France
    let utcDate = new Date(`${dateStr}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00Z`);
    // Format in Europe/Paris (France time) - this automatically handles +1 or +2
    let fr = new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris',hour12:false}).format(utcDate);
    return fr;
  }catch(e){
    // Fallback: just add 1 hour to match Flashscore
    let [h,m]=timeStr.split(':').map(Number); if(isNaN(h)) return timeStr;
    h=(h+1)%24; return `${String(h).padStart(2,'0')}:${String(m||0).padStart(2,'0')}`;
  }
}

function fmtDate(d){ return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function buildTabs(){
  const c=document.getElementById('dayTabs'); const today=new Date(); let html='';
  for(let i=-2;i<=3;i++){ let d=new Date(); d.setDate(today.getDate()+i); let iso=d.toISOString().split('T')[0]; let diff=Math.round((d-today)/86400000); let label=diff===0?'Today':diff===-1?'Yesterday':diff===1?'Tomorrow':d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); html+=`<button class="tab ${iso===currentDate?'active':''}" onclick="pickDate('${iso}')">${label}</button>`; }
  html+=`<select class="tab-drop" onchange="pickDate(this.value)"><option>More ▼</option>${(()=>{let o='';for(let i=-7;i<=7;i++){let d=new Date(); d.setDate(today.getDate()+i); let iso=d.toISOString().split('T')[0]; o+=`<option value="${iso}">${iso}</option>`;}return o;})()}</select>`;
  c.innerHTML=html;
}
function pickDate(iso){ currentDate=iso; document.getElementById('dateHead').innerText=fmtDate(iso); buildTabs(); loadMatches(iso); }
function setFilter(f){ currentFilter=f; document.querySelectorAll('.f').forEach(b=>b.classList.toggle('active',b.dataset.f===f)); render(); }
function getStatus(m){ const s=m.status||m.state||m.status_type||m.match_status||''; if(typeof s==='object') return (s.type||s.name||s.state||'').toLowerCase(); return s.toString().toLowerCase(); }

// *** SHOW REAL RESULTS FOR ANY DAY ***
function getScore(m){
  // Check all possible fields your API can return
  try{
    // Direct string
    if(typeof m.result==='string' && m.result.includes('-')) return m.result;
    if(typeof m.score==='string' && m.score.includes('-')) return m.score;
    
    const sc = m.scores || m.score || m.result || m.goals || {};
    if(typeof sc==='string') return sc;
    
    // Object with home/away
    let h = sc.home ?? sc.home_score ?? m.home_score ?? m.homeScore ?? sc.homeScore ?? m.home_goals ?? m.goals_home ?? null;
    let a = sc.away ?? sc.away_score ?? m.away_score ?? m.awayScore ?? sc.awayScore ?? m.away_goals ?? m.goals_away ?? null;
    
    // Sometimes scores inside score.home / score.away
    if(h===null && m.score){
      h = m.score.home ?? m.score.home_score ?? null;
      a = m.score.away ?? m.score.away_score ?? null;
    }
    // Full time
    if(h===null && m.full_time){
      h = m.full_time.home; a = m.full_time.away;
    }
    // If we found both, return them even if 0-0
    if(h!==null && a!==null && (h!=='' || a!=='')){
      return `${h} - ${a}`;
    }
    // For finished matches, if still -, try to get from status
    if(m.ft_score) return m.ft_score;
  }catch(e){}
  return '-';
}

async function loadMatches(date){
  const list=document.getElementById('list');
  list.innerHTML=`<div style="text-align:center;padding:40px;color:#8b8f99">Loading ${date} - France time...</div>`;
  try{
    const r=await fetch(`/api/matches?date=${date}`);
    const d=await r.json();
    allMatches=d.data?.matches||d.data||d.matches||[];
    console.log('Loaded', allMatches.length, 'first sample:', allMatches[0]);
    render();
  }catch(e){ list.innerHTML='Error: '+e.message; }
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let filtered=allMatches.filter(m=>{
    const st=getStatus(m);
    if(currentFilter==='live' && !(st.includes('live')||st.includes('inplay')||st.includes('1h')||st.includes('2h')||st.includes('ht'))) return false;
    if(currentFilter==='finished' && !(st.includes('finish')||st.includes('ft')||st.includes('ended')||st.includes('full')||st.includes('aet')||st.includes('pen')||st.includes('after'))) return false;
    if(currentFilter==='scheduled' && !(st.includes('sched')||st.includes('ns')||st===''||st.includes('not')||st.includes('pre'))) return false;
    if(q){
      const txt=`${m.league?.name||''} ${m.home?.name||''} ${m.away?.name||''} ${m.league?.country||''} ${m.country||''}`.toLowerCase();
      if(!txt.includes(q)) return false;
    }
    return true;
  });

  const groups={};
  filtered.forEach(m=>{
    const country=(m.league?.country||m.country||'World').toString().trim();
    const lname=(m.league?.name||'League').toString().trim();
    const key=`${country.toUpperCase()}: ${lname.toUpperCase()}`;
    if(!groups[key]) groups[key]={country,lname,raw:key,matches:[]};
    groups[key].matches.push(m);
  });

  let sorted=Object.values(groups).sort((a,b)=>{
    const pa=getPrio(a.raw), pb=getPrio(b.raw);
    if(pa!==pb) return pa-pb;
    return a.raw.localeCompare(b.raw);
  });

  const list=document.getElementById('list');
  if(!filtered.length){ list.innerHTML='<div style="text-align:center;padding:40px;color:#8b8f99">No matches for this filter on '+currentDate+'</div>'; return; }

  list.innerHTML=sorted.map(g=>`
    <div class="league-head"><div class="l"><span class="country">${g.country.toUpperCase()}</span>: <span class="lname">${g.lname.toUpperCase()}</span></div><span>Standings</span></div>
    <div>
    ${g.matches.map(m=>{
      const st=getStatus(m); const isLive=st.includes('live')||st.includes('inplay');
      const isFin=st.includes('finish')||st.includes('ft')||st.includes('ended')||st.includes('full');
      const time=toFranceTime(m.kickoff||m.time||m.start_time||m.match_time, currentDate);
      const home=m.home?.name||m.home_team?.name||m.home||'Home';
      const away=m.away?.name||m.away_team?.name||m.away||'Away';
      const score=getScore(m);
      const showScore = score!=='-' ? score : '-';
      return `<div class="match-row" onclick="openMatch('${m.id||m.match_id}')">
        <div class="time ${isLive?'live':''}">${isLive?'<span class="dot"></span>':''}${time}</div>
        <div class="teams"><div>${home}</div><div>${away}</div></div>
        <div class="score ${isLive?'live':''} ${isFin?'finished':''}">${showScore}</div>
      </div>`;
    }).join('')}
    </div>
  `).join('');
}

function openMatch(id){
  const m=allMatches.find(x=>(x.id||x.match_id)==id); if(!m) return;
  document.getElementById('modal').classList.add('show');
  document.getElementById('mTitle').innerText=`${m.home?.name||''} vs ${m.away?.name||''}`;
  document.getElementById('mBody').innerHTML=`<p><b>League:</b> ${m.league?.name} (${m.league?.country})</p><p><b>Date:</b> ${currentDate}</p><p><b>France Time:</b> ${toFranceTime(m.kickoff||m.time,currentDate)} (Europe/Paris)</p><p><b>Status:</b> ${getStatus(m)}</p><p><b>Score:</b> ${getScore(m)}</p><p style="margin-top:10px;color:#8b8f99">Match go show result when finished. For Today, Future matches show -, Finished show like 2-1</p>`;
}

buildTabs(); loadMatches(currentDate);
setInterval(()=>loadMatches(currentDate),60000);
</script>
</body>
</html>
