<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livescore Final - FT Top No Auto Refresh</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0e14;color:#fff;font-family:Arial}
.top{padding:14px 16px;background:#0f131d;border-bottom:1px solid #1c2132;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:15px;font-weight:900}.live-badge{color:#ff3b30;font-size:12px;font-weight:900}.refresh{color:#00e676;font-size:24px;cursor:pointer;font-weight:900;background:#1a1f2f;border:1px solid #242b40;border-radius:20px;padding:4px 12px}
.days{display:flex;gap:8px;padding:12px;background:#0b0e14;overflow-x:auto;position:sticky;top:52px;z-index:90;border-bottom:1px solid #1c2132}.days::-webkit-scrollbar{display:none}
.d{padding:9px 16px;border-radius:20px;background:#1a1f2f;color:#8a8fa3;border:1px solid #242b40;font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0;text-align:center}
.d small{display:block;font-size:9px;opacity:.6;margin-top:2px}.d.active{background:#00e676;color:#000;border-color:#00e676}
.filters{display:flex;gap:8px;padding:12px 16px;background:#0b0e14;overflow-x:auto}.filters::-webkit-scrollbar{display:none}
.f{padding:8px 16px;border-radius:20px;background:#1a1f2f;color:#8a8fa3;border:1px solid #242b40;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}
.f.active{background:#fff;color:#000}
.search{margin:12px 16px;background:#151a27;border:1px solid #242b40;border-radius:12px;display:flex;align-items:center;padding:12px 14px;gap:10px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:14px}
.ad-wrap{margin:12px 16px;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:10px}
.ad-btn{display:block;background:linear-gradient(90deg,#00e676,#00c853);color:#000;text-align:center;padding:12px;border-radius:8px;font-weight:900;text-decoration:none;font-size:13px}
.count{margin:0 16px 8px;color:#5a6075;font-size:11px;font-weight:700}
.league{background:#1a1f2f;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #242b40;cursor:pointer;position:sticky;top:109px;z-index:10}
.league-left{color:#00e676;font-size:11px;font-weight:900}.league-right{color:#5a6075;font-size:11px;font-weight:700}
.match{display:flex;align-items:center;padding:13px 14px;background:#0f131d;border-bottom:1px solid #1c2132;cursor:pointer}
.match:hover{background:#151a27}.time{width:60px;font-size:12px;color:#8a8fa3;font-weight:700;flex-shrink:0}.time.live{color:#ff3b30;font-weight:900}.time.ft{color:#fff;font-weight:900}
.teams{flex:1;min-width:0}.team{font-size:13.5px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d0d4e0}
.score{width:65px;text-align:right;font-weight:900;font-size:13px}.score.live{color:#00e676}.score.ft{color:#fff}
.loading{padding:50px;text-align:center;color:#5a6075}
</style></head><body>
<div class="top"><b id="dateHead">France</b><div style="display:flex;gap:12px;align-items:center"><span id="liveCount" class="live-badge"></span><span class="refresh" onclick="loadMatches(currentDate)">↻ Refresh</span></div></div>
<div class="days" id="days"></div>
<div class="filters"><button class="f active" data-f="all" onclick="setF('all')">All games</button><button class="f" data-f="live" onclick="setF('live')">Live</button><button class="f" data-f="finished" onclick="setF('finished')">Finished</button><button class="f" data-f="scheduled" onclick="setF('scheduled')">Scheduled</button></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Search country, league, club..." oninput="render()"></div>
<div class="ad-wrap"><a class="ad-btn" href="https://www.bet9ja.com" target="_blank">BET NOW 300% BONUS → Tap to claim</a><div style="text-align:center;color:#5a6075;font-size:10px;margin-top:6px">Advertisement - Replace link with your affiliate link to earn money</div></div>
<div class="count" id="count"></div>
<div id="list"></div>
<script>
function getFranceDate(off=0){const now=new Date();const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'});let d=new Date(fmt.format(now)+'T12:00:00');d.setDate(d.getDate()+off);return d.toISOString().split('T')[0];}
let currentDate=getFranceDate(0),allMatches=[],currentFilter='all';
function buildDays(){const el=document.getElementById('days');let h='';for(let i=-4;i<=4;i++){let iso=getFranceDate(i);let dt=new Date(iso+'T12:00:00');let label=i===-1?'Yesterday':i===0?'Today':i===1?'Tomorrow':dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});let sub=iso.slice(5).replace('-','/');h+=`<button class="d ${iso===currentDate?'active':''}" onclick="pick('${iso}')">${label}<small>${sub}</small></button>`;}el.innerHTML=h;document.getElementById('dateHead').innerText='France '+currentDate;}
function pick(iso){currentDate=iso;buildDays();loadMatches(iso);}function setF(f){currentFilter=f;document.querySelectorAll('.f').forEach(b=>b.classList.toggle('active',b.dataset.f===f));render();}

// ✅ CORRECT FRANCE TIME - 14:00 UTC = 16:00 France
function toFranceTime(t){
  if(!t) return '--:--';
  let s=t;if(s.includes('T')) s=s.split('T')[1];
  s=s.substring(0,5);if(!s.includes(':')) return s;
  let p=s.split(':');let hh=parseInt(p[0],10);let mm=p[1];
  if(isNaN(hh)) return s;
  hh=(hh+2)%24;
  return `${String(hh).padStart(2,'0')}:${mm}`;
}
function getScore(m){
  const st=m.status||{};const disp=(st.display||'').toString();
  const live=st.is_live===true||disp.toLowerCase().includes('live');
  const fin=(st.status||'').toLowerCase()==='finished'||disp==='FT';
  let hs=m.home?.score,as=m.away?.score;
  let valid=hs!==null&&hs!==undefined&&String(hs)!==''&&String(hs).toLowerCase()!=='null'&&as!==null&&as!==undefined&&String(as)!==''&&String(as).toLowerCase()!=='null';
  if(valid){
    if(fin) return {txt:`${hs} - ${as}`,time:'FT',live:false,fin:true,sched:false};
    if(live) return {txt:`${hs} - ${as}`,time:disp||'LIVE',live:true,fin:false,sched:false};
    return {txt:`${hs} - ${as}`,time:'FT',live:false,fin:true,sched:false};
  }
  return {txt:'-',time:toFranceTime(m.kickoff||m.time||''),live:false,fin:false,sched:true};
}
function getLeague(m){
  const L=m.League||m.league||{};let c=(L.country||'World').trim()||'World';let n=(L.name||'League').trim()||'League';
  let key=`${c.toUpperCase()}: ${n.toUpperCase()}`;
  if(key.includes('CAF')) return null;
  if(key.includes('U19')||key.includes('U20')||key.includes('U-19')) return null;
  return {country:c,name:n,key};
}
function getPriority(key){
  const k=key.toUpperCase();
  if(k.includes('CHAMPIONS LEAGUE')&&k.includes('EUROPE')) return 1;
  if(k.includes('EUROPA LEAGUE')&&!k.includes('CONFERENCE')) return 2;
  if(k.includes('CONFERENCE LEAGUE')) return 3;
  if(k==='ENGLAND: PREMIER LEAGUE') return 4;
  if(k==='FRANCE: LIGUE 1') return 5;
  if(k==='GERMANY: BUNDESLIGA') return 6;
  if(k==='ITALY: SERIE A') return 7;
  if(k.includes('LALIGA')||k.includes('LA LIGA')) return 8;
  if(k.includes('EREDIVISIE')) return 9;
  if(k.includes('PORTUGAL')&&k.includes('LIGA')) return 10;
  return 100;
}
async function loadMatches(date){
  document.getElementById('list').innerHTML=`<div class="loading">Loading ${date}... France time</div>`;
  try{
    let r=await fetch(`/api/matches?date=${date}`,{cache:'no-store'});
    let d=await r.json();
    allMatches=d.data?.matches||d.matches||d.data||[];
    if(!Array.isArray(allMatches)) allMatches=[];
    render();
  }catch(e){
    document.getElementById('list').innerHTML=`<div class="loading">Error ${e.message}<br><button onclick="loadMatches(currentDate)" style="margin-top:12px;background:#00e676;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:900">Retry ↻</button></div>`;
  }
}
function openLeague(c,l){location.href=`/standings.html?country=${encodeURIComponent(c)}&league=${encodeURIComponent(l)}&date=${currentDate}`;}
function openMatch(m){let data=encodeURIComponent(JSON.stringify(m));location.href=`/match.html?data=${data}&date=${currentDate}&id=${m.id||''}`;}
function render(){
  let q=document.getElementById('q').value.toLowerCase();
  let filt=allMatches.filter(m=>{
    let L=getLeague(m);if(!L) return false;
    let gs=getScore(m);
    if(currentFilter==='live'&&!gs.live) return false;
    if(currentFilter==='finished'&&!gs.fin) return false;
    if(currentFilter==='scheduled'&&!gs.sched) return false;
    if(q){let txt=`${L.country} ${L.name} ${m.home?.name||''} ${m.away?.name||''}`.toLowerCase();if(!txt.includes(q)) return false;}
    return true;
  });
  let groups={};filt.forEach(m=>{let L=getLeague(m);if(!L) return;if(!groups[L.key]) groups[L.key]={country:L.country,name:L.name,key:L.key,p:getPriority(L.key),matches:[]};groups[L.key].matches.push(m);});
  let sorted=Object.values(groups).sort((a,b)=>{if(a.p!==b.p) return a.p-b.p;if(a.country.toUpperCase()!==b.country.toUpperCase()) return a.country.toUpperCase().localeCompare(b.country.toUpperCase());return a.name.toUpperCase().localeCompare(b.name.toUpperCase());});
  // ✅ FT ON TOP
  sorted.forEach(g=>{
    g.matches.sort((x,y)=>{
      let gx=getScore(x),gy=getScore(y);
      if(gx.fin&&!gy.fin) return -1;
      if(!gx.fin&&gy.fin) return 1;
      if(gx.live&&!gy.live) return -1;
      if(!gx.live&&gy.live) return 1;
      return gx.time.localeCompare(gy.time);
    });
  });
  let liveNum=filt.filter(m=>getScore(m).live).length;
  document.getElementById('liveCount').innerText=liveNum?`${liveNum} LIVE`:'';
  document.getElementById('count').innerText=`${filt.length} matches • ${sorted.length} leagues • ${currentDate} • No auto-refresh`;
  let list=document.getElementById('list');
  if(!filt.length){list.innerHTML=`<div class="loading">No matches for ${currentDate}<br><button onclick="setF('all')" style="background:#fff;color:#000;border:none;padding:8px 16px;border-radius:20px;margin-top:10px">Show All</button></div>`;return;}
  list.innerHTML=sorted.map(g=>`<div class="league" onclick="openLeague('${g.country.replace(/'/g,"")}','${g.name.replace(/'/g,"")}')"><div class="league-left">🟢 ${g.country.toUpperCase()}: ${g.name.toUpperCase()}</div><div class="league-right">Standings ›</div></div>${g.matches.map(m=>{let gs=getScore(m);let safe=JSON.stringify(m).replace(/'/g,"&#39;");let tClass=gs.live?'live':gs.fin?'ft':'';return `<div class="match" onclick='openMatch(${safe})'><div class="time ${tClass}">${gs.time}</div><div class="teams"><div class="team">${m.home?.name||'Home'}</div><div class="team">${m.away?.name||'Away'}</div></div><div class="score ${tClass}">${gs.txt}</div></div>`;}).join('')}`).join('');
}
buildDays();loadMatches(currentDate);
// ✅ NO AUTO REFRESH - REMOVED setInterval, user go click Refresh button manually
</script></body></html>
