<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>France 2026-10-17 Top 10</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.top{background:#000;padding:14px 16px;border-bottom:1px solid #222;position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#000;position:sticky;top:48px;z-index:15;border-bottom:1px solid #1a1a1a}.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:20px;background:#1a1a1a;color:#999;border:1px solid #2a2a2a;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}.tab.active{background:#00d26a;color:#000}
.filters{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#000}.f{padding:6px 14px;border-radius:20px;background:#1a1a1a;color:#999;border:1px solid #2a2a2a;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.f.active{background:#fff;color:#000}
.search{margin:10px 12px;background:#1a1a1a;border-radius:8px;display:flex;padding:10px 12px;gap:8px;border:1px solid #252525}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.league-head{background:#1e222d;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2a2f3d;border-bottom:1px solid #2a2f3d}
.l{font-size:11px;font-weight:900}.country{color:#00d26a}.sep{color:#00d26a}.lname{color:#00d26a}.stand{color:#00d26a;text-decoration:underline;font-size:11px}
.match-row{display:flex;align-items:center;padding:10px 12px;background:#000;border-bottom:1px solid #141414}
.time{width:48px;font-size:12px;color:#888;font-weight:700}.time.live{color:#ff3d3d}.teams{flex:1;font-size:13px;line-height:17px}.score{width:55px;text-align:right;font-weight:800}.score.live{color:#00d26a}
</style></head><body>
<div class="top"><b id="dateHead"></b></div>
<div class="tabs" id="dayTabs"<>/div>
<div class="filters"><button class="f active" data-f="all" onclick="setFilter('all')">All</button><button class="f" data-f="live" onclick="setFilter('live')">Live</button><button class="f" data-f="finished" onclick="setFilter('finished')">Finished</button><button class="f" data-f="scheduled" onclick="setFilter('scheduled')">Scheduled</button><button class="f" onclick="loadMatches(currentDate)">↻</button></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Search..." oninput="render()"></div>
<div id="list"></div>
<script>
function getFranceDateISO(o=0){const now=new Date();const fr=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);let d=new Date(fr+'T12:00:00');d.setDate(d.getDate()+o);return d.toISOString().split('T')[0];}
let currentDate=getFranceDateISO(0),allMatches=[],currentFilter='all';
function buildTabs(){const c=document.getElementById('dayTabs');let h='';for(let i=-2;i<=2;i++){let iso=getFranceDateISO(i);let label=i===0?'Today':i===-1?'Yesterday':i===1?'Tomorrow':iso.slice(5);h+=`<button class="tab ${iso===currentDate?'active':''}" onclick="pickDate('${iso}')">${label}</button>`;}c.innerHTML=h;document.getElementById('dateHead').innerText='France '+currentDate;}
function pickDate(iso){currentDate=iso;buildTabs();loadMatches(iso);}function setFilter(f){currentFilter=f;document.querySelectorAll('.f').forEach(b=>b.classList.toggle('active',b.dataset.f===f));render();}
function isValid(v){if(v===null||v===undefined) return false;const s=String(v).trim().toLowerCase();return s!==""&&s!=="null"&&s!=="undefined";}
function toFranceTime(t){if(!t||!t.includes(':')) return t||'00:00';const p=t.split(':');let h=parseInt(p[0],10),m=parseInt(p[1],10);if(isNaN(h)) return t;h=(h+2)%24;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
function getScore(m){const st=m.status||{};const disp=(st.display||'').toString();const live=st.is_live===true;const fin=(st.status||'').toLowerCase()==='finished'||disp==='FT';const sched=!live&&!fin;let hs=m.home?.score,as=m.away?.score;if(!isValid(hs))hs=null;if(!isValid(as))as=null;if(isValid(hs)&&isValid(as)){if(fin) return {s:`${hs} - ${as}`,t:'FT',live:false,fin:true,sched:false,ok:true};if(live) return {s:`${hs} - ${as}`,t:disp||'LIVE',live:true,fin:false,sched:false,ok:true};return {s:`${hs} - ${as}`,t:'FT',live:false,fin:true,sched:false,ok:true};}if(sched){return {s:'-',t:toFranceTime(m.kickoff||''),live:false,fin:false,sched:true,ok:true};}return {s:'-',t:disp,live,fin,ok:false};}

// FIX ENGLAND WRONG LABEL + DEEP FIND LEAGUE
function deepFindLeague(m){
  const L=m.League||m.league||{};let c=(L.country||'').toString().trim();let n=(L.name||'').toString().trim();
  if(!c) c='WORLD'; if(!n) n='LEAGUE';
  let key=`${c.toUpperCase()}: ${n.toUpperCase()}`;
  const home=(m.home?.name||'').toLowerCase(); const away=(m.away?.name||'').toLowerCase();
  
  // FIX: Hull City, Ipswich etc na Championship, no be Premier League for 2026-10-17
  const championshipTeams=['hull city','hull','ipswich','blackburn','preston','swansea','stoke','millwall','qpr','sheffield wed','norwich','watford','middlesbrough','coventry'];
  const isChampionshipTeam=championshipTeams.some(t=>home.includes(t) || away.includes(t));
  if(key==='ENGLAND: PREMIER LEAGUE' && isChampionshipTeam){
    c='ENGLAND'; n='CHAMPIONSHIP'; key='ENGLAND: CHAMPIONSHIP';
  }
  
  return {country:c,name:n,key};
}

// TOP 10 - CAF + NORWAY U19 REMOVED
function getTop10Priority(key){
  const k=key.toUpperCase().trim();
  // REMOVE CAF AND NORWAY U19 FROM TOP 10
  if(k.includes('CAF') || (k.includes('AFRICA') && k.includes('CHAMPIONS LEAGUE'))) return 100;
  if(k.includes('NORWAY') && (k.includes('U19') || k.includes('U-19') || k.includes('NATIONAL') || k.includes('CHAMPIONS LEAGUE'))) return 100;
  if(k.includes('U19') || k.includes('U-19')) return 100;

  // TOP 10 ONLY EUROPE
  if(k==='EUROPE: CHAMPIONS LEAGUE' || k==='EUROPE: UEFA CHAMPIONS LEAGUE' || (k.startsWith('EUROPE:') && k.includes('CHAMPIONS LEAGUE') && !k.includes('CAF'))) return 1;
  if(k==='EUROPE: EUROPA LEAGUE' || k==='EUROPE: UEFA EUROPA LEAGUE' || (k.startsWith('EUROPE:') && k.includes('EUROPA LEAGUE') && !k.includes('CONFERENCE'))) return 2;
  if(k==='EUROPE: CONFERENCE LEAGUE' || k==='EUROPE: UEFA CONFERENCE LEAGUE' || k==='EUROPE: EUROPA CONFERENCE LEAGUE') return 3;
  if(k==='ENGLAND: PREMIER LEAGUE') return 4;
  if(k==='FRANCE: LIGUE 1') return 5;
  if(k==='GERMANY: BUNDESLIGA') return 6;
  if(k==='ITALY: SERIE A') return 7;
  if(k==='SPAIN: LALIGA' || k==='SPAIN: LA LIGA' || k.includes('SPAIN: LALIGA')) return 8;
  if(k==='NETHERLANDS: EREDIVISIE') return 9;
  if(k==='PORTUGAL: PRIMEIRA LIGA' || k.includes('PORTUGAL: LIGA')) return 10;
  if(k.startsWith('ENGLAND:')) return 20;
  if(k.startsWith('FRANCE:')) return 21;
  if(k.startsWith('GERMANY:')) return 22;
  if(k.startsWith('ITALY:')) return 23;
  if(k.startsWith('SPAIN:')) return 24;
  if(k.startsWith('NETHERLANDS:')) return 25;
  if(k.startsWith('PORTUGAL:')) return 26;
  if(k.startsWith('EUROPE:')) return 27;
  if(k==='WORLD: LEAGUE') return 999;
  return 100;
}
async function loadMatches(date){document.getElementById('list').innerHTML=`<div style="text-align:center;padding:30px;color:#666">Loading France ${date}... Top 10 No CAF</div>`;try{const r=await fetch(`/api/matches?date=${date}`);const d=await r.json();allMatches=d.data?.matches||[];render();}catch(e){document.getElementById('list').innerHTML='Error '+e.message;}}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let filt=allMatches.filter(m=>{
    const gs=getScore(m); if(!gs.ok) return false;
    if(currentFilter==='live'&&!gs.live) return false;
    if(currentFilter==='finished'&&!gs.fin) return false;
    if(currentFilter==='scheduled'&&!gs.sched) return false;
    if(q){const L=deepFindLeague(m);const txt=`${L.country} ${L.name} ${m.home?.name||''} ${m.away?.name||''}`.toLowerCase();if(!txt.includes(q))return false;}
    return true;
  });
  const groups={};filt.forEach(m=>{const L=deepFindLeague(m);const key=L.key;if(!groups[key])groups[key]={country:L.country,name:L.name,key,p:getTop10Priority(key),matches:[]};groups[key].matches.push(m);});
  const sorted=Object.values(groups).sort((a,b)=>{if(a.p!==b.p) return a.p-b.p; return a.key.localeCompare(b.key);});
  const list=document.getElementById('list');if(!filt.length){list.innerHTML=`<div style="text-align:center;padding:30px;color:#666">No matches</div>`;return;}
  list.innerHTML=sorted.map(g=>`<div class="league-head"><div class="l"><span class="country">${g.country.toUpperCase()}</span><span class="sep">: </span><span class="lname">${g.name.toUpperCase()}</span></div><span class="stand">Standings</span></div>${g.matches.map(m=>{const gs=getScore(m);return `<div class="match-row"><div class="time ${gs.live?'live':''}">${gs.t}</div><div class="teams"><div>${m.home?.name}</div><div>${m.away?.name}</div></div><div class="score ${gs.live?'live':''}">${gs.s}</div></div>`;}).join('')}`).join('')+`<div style="text-align:center;padding:12px;color:#444;font-size:10px">France ${currentDate} TOP 10: 1 UCL 2 UEL 3 UECL 4 ENG PL 5 FRA L1 6 GER BL 7 ITA SA 8 SPA LL 9 NED Ere 10 POR PL + A-Z - CAF & Norway U19 removed - England fixed</div>`;
}
buildTabs();loadMatches(currentDate);
</script></body></html>
