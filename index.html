<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashscore 2026 Live</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial,system-ui}
.top{background:#000;padding:14px 16px;border-bottom:1px solid #1f1f1f;position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#000;position:sticky;top:48px;z-index:15;border-bottom:1px solid #1a1a1a}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 16px;border-radius:20px;background:#1a1a1a;color:#999;border:1px solid #2a2a2a;font-weight:700;font-size:13px;cursor:pointer}.tab.active{background:#00d26a;color:#000}
.filters{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#000}.f{padding:6px 14px;border-radius:20px;background:#1a1a1a;color:#999;border:1px solid #2a2a2a;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.f.active{background:#fff;color:#000}
.search{margin:10px 12px;background:#1a1a1a;border-radius:8px;display:flex;padding:10px 12px;gap:8px;border:1px solid #252525}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.league-head{background:#1a1d24;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #252a34;border-bottom:1px solid #252a34}
.l{font-size:11px;font-weight:800}.country{color:#fff}.sep{color:#666}.lname{color:#00d26a}.stand{color:#888;font-size:11px}
.match-row{display:flex;align-items:center;padding:10px 12px;background:#000;border-bottom:1px solid #141414}
.time{width:48px;font-size:12px;color:#888;font-weight:700}.time.live{color:#ff3d3d}.time.sched{color:#888}
.teams{flex:1;font-size:13px;line-height:17px}.score{width:55px;text-align:right;font-weight:800;font-size:13px}.score.live{color:#00d26a}.score.sched{color:#555}.dot{width:6px;height:6px;background:#ff3d3d;border-radius:50%;display:inline-block;margin-right:4px;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
</style></head><body>
<div class="top"><b id="dateHead"></b> <small style="color:#888">France Time - Flashscore Style</small></div>
<div class="tabs" id="dayTabs"></div>
<div class="filters"><button class="f active" data-f="all" onclick="setFilter('all')">All</button><button class="f" data-f="live" onclick="setFilter('live')">Live</button><button class="f" data-f="finished" onclick="setFilter('finished')">Finished</button><button class="f" data-f="scheduled" onclick="setFilter('scheduled')">Scheduled</button><button class="f" onclick="loadMatches(currentDate)">↻</button></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Search team, league..." oninput="render()"></div>
<div id="list"></div>
<script>
function getFranceDateISO(o=0){const now=new Date();const fr=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);let d=new Date(fr+'T12:00:00');d.setDate(d.getDate()+o);return d.toISOString().split('T')[0];}
let currentDate=getFranceDateISO(0),allMatches=[],currentFilter='all';
function buildTabs(){const c=document.getElementById('dayTabs');let h='';for(let i=-2;i<=2;i++){let iso=getFranceDateISO(i);let label=i===0?'Today':i===-1?'Yesterday':i===1?'Tomorrow':iso.slice(5);h+=`<button class="tab ${iso===currentDate?'active':''}" onclick="pickDate('${iso}')">${label}</button>`;}c.innerHTML=h;document.getElementById('dateHead').innerText='France '+currentDate;}
function pickDate(iso){currentDate=iso;buildTabs();loadMatches(iso);}function setFilter(f){currentFilter=f;document.querySelectorAll('.f').forEach(b=>b.classList.toggle('active',b.dataset.f===f));render();}
function isValid(v){if(v===null||v===undefined) return false;const s=String(v).trim().toLowerCase();return s!==""&&s!=="null"&&s!=="undefined";}
function getScore(m){
  const st=m.status||{}; const disp=(st.display||'').toString(); const live=st.is_live===true;
  const statusStr=(st.status||'').toLowerCase(); const isFinished=statusStr==='finished'||disp==='FT';
  const isScheduled=!live&&!isFinished;
  let hs=m.home?.score,as=m.away?.score;
  if(!isValid(hs)) hs=m.home_score??null; if(!isValid(as)) as=m.away_score??null;
  if(isValid(hs)&&isValid(as)){
    if(isFinished) return {s:`${hs} - ${as}`,t:'FT',live:false,fin:true,sched:false,ok:true};
    if(live) return {s:`${hs} - ${as}`,t:disp||'LIVE',live:true,fin:false,sched:false,ok:true};
    return {s:`${hs} - ${as}`,t:'FT',live:false,fin:true,sched:false,ok:true};
  }
  // No score - check if scheduled (never start) - SHOW IT with kickoff time
  if(isScheduled){
    const ko=m.kickoff||m.time||''; // e.g. "15:00" or "00:00"
    const timeDisplay=ko && ko!=='00:00' ? ko : (disp||' - ');
    return {s:'-',t:timeDisplay,live:false,fin:false,sched:true,ok:true};
  }
  return {s:'-',t:disp,live,fin:isFinished,sched:false,ok:false};
}
function getLeague(m){const L=m.League||{};return {country:String(L.country||'World').trim(),name:String(L.name||'League').trim()};}
function getPriority(k){const u=k.toUpperCase();if(u.includes('CHAMPIONS LEAGUE'))return 1;if(u.includes('PREMIER LEAGUE'))return 2;if(u.includes('LALIGA')||u.includes('LA LIGA'))return 3;if(u.includes('BUNDESLIGA'))return 4;if(u.includes('SERIE A'))return 5;if(u.includes('LIGUE 1'))return 6;if(u.includes('ARGENTINA'))return 7;if(u.includes('AUSTRALIA'))return 8;if(u.includes('BOLIVIA'))return 9;return 99;}
async function loadMatches(date){document.getElementById('list').innerHTML=`<div style="text-align:center;padding:30px;color:#666">Loading ${date}...</div>`;try{const r=await fetch(`/api/matches?date=${date}`);const d=await r.json();allMatches=d.data?.matches||[];render();}catch(e){document.getElementById('list').innerHTML='Error '+e.message;}}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let filt=allMatches.filter(m=>{
    const gs=getScore(m);
    if(!gs.ok) return false; // hide only finished/live with null score, but KEEP scheduled
    if(currentFilter==='live'&&!gs.live) return false;
    if(currentFilter==='finished'&&!gs.fin) return false;
    if(currentFilter==='scheduled'&&!gs.sched) return false;
    if(q){const L=getLeague(m);const txt=`${L.country} ${L.name} ${m.home?.name||''} ${m.away?.name||''}`.toLowerCase();if(!txt.includes(q))return false;}
    return true;
  });
  const groups={};filt.forEach(m=>{const L=getLeague(m);const key=`${L.country.toUpperCase()}: ${L.name.toUpperCase()}`;if(!groups[key])groups[key]={country:L.country,name:L.name,key,p:getPriority(key),matches:[]};groups[key].matches.push(m);});
  const sorted=Object.values(groups).sort((a,b)=>a.p!==b.p?a.p-b.p:a.key.localeCompare(b.key));
  const list=document.getElementById('list');if(!filt.length){list.innerHTML=`<div style="text-align:center;padding:30px;color:#666">No ${currentFilter} for ${currentDate}<br>Total: ${allMatches.length}</div>`;return;}
  list.innerHTML=sorted.map(g=>`<div class="league-head"><div class="l"><span class="country">${g.country.toUpperCase()}</span><span class="sep">: </span><span class="lname">${g.name.toUpperCase()}</span></div><span class="stand">Standings ›</span></div>${g.matches.map(m=>{const gs=getScore(m);const cls=gs.live?'live':gs.sched?'sched':'';return `<div class="match-row"><div class="time ${cls}">${gs.live?'<span class="dot"></span>':''}${gs.t}</div><div class="teams"><div>${m.home?.name||'Home'}</div><div>${m.away?.name||'Away'}</div></div><div class="score ${cls}">${gs.s}</div></div>`;}).join('')}`).join('')+`<div style="text-align:center;padding:12px;color:#333;font-size:10px">${filt.length} matches - Scheduled + Live + Finished - Flashscore style</div>`;
}
buildTabs();loadMatches(currentDate);
</script></body></html>
