<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveScore REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1419;color:#fff;font-family:system-ui;padding:12px}
.header{background:#1a2332;padding:14px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:12px;position:sticky;top:0}
.live-dot{width:10px;height:10px;background:#00ff88;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.match{background:#1e293b;padding:14px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.score{color:#00ff88;font-weight:bold;font-size:18px}
.league{font-size:11px;color:#94a3b8;margin-bottom:3px}
.status{font-size:11px;background:#00ff88;color:#000;padding:3px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="header"><b>⚽ LIVESCORE</b><span><span class="live-dot"></span> REAL LIVE (<span id="count">-</span>)</span></div>
<div id="list" style="text-align:center;padding:30px;">Loading REAL matches...</div>
<script>
async function load(){
  const list=document.getElementById('list');
  const count=document.getElementById('count');
  try{
    const r=await fetch('/api/matches');
    const d=await r.json();
    const ms = d.data?.matches || d.data || d.matches || [];
    count.innerText = ms.length;
    if(!ms.length){
      list.innerHTML = 'No matches at this exact time. Try again later.';
      return;
    }
    list.innerHTML=ms.map(m=>`
      <div class="match">
        <div>
          <div class="league">${m.league?.name||'League'} • ${m.kickoff||''} • ${m.status||''}</div>
          <div><b>${m.home?.name||m.home_team||'Home'}</b> vs <b>${m.away?.name||m.away_team||'Away'}</b></div>
        </div>
        <div style="text-align:right">
          <div class="score">${m.score?.home??m.home_score??m.scores?.home??'-'} - ${m.score?.away??m.away_score??m.scores?.away??'-'}</div>
          <div class="status">${m.status||'LIVE'}</div>
        </div>
      </div>`).join('');
  }catch(e){
    list.innerHTML='Error: '+e.message;
  }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
