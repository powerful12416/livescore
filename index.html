<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>France</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.top{background:#000;padding:16px;font-size:18px;font-weight:900;border-bottom:1px solid #222;position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#000;position:sticky;top:52px;z-index:15;border-bottom:1px solid #1a1a1a}.tab{padding:8px 16px;border-radius:20px;background:#1a1a1a;color:#999;border:1px solid #2a2a2a;font-weight:700;font-size:13px;white-space:nowrap}.tab.active{background:#00d26a;color:#000}
.filters{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#000}.f{padding:6px 14px;border-radius:20px;background:#1a1a1a;color:#999;border:1px solid #2a2a2a;font-size:12px;font-weight:700;white-space:nowrap}.f.active{background:#fff;color:#000}
.search{margin:10px 12px;background:#1a1a1a;border-radius:8px;display:flex;padding:10px 12px;gap:8px;border:1px solid #252525}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.league-head{background:#1e222d;padding:10px 12px;display:flex;justify-content:space-between;border-top:1px solid #2a2f3d;border-bottom:1px solid #2a2f3d}
.l{font-size:11px;font-weight:900}.country{color:#00d26a}.lname{color:#00d26a}.stand{color:#00d26a;text-decoration:underline;font-size:11px}
.match-row{display:flex;align-items:center;padding:10px 12px;background:#000;border-bottom:1px solid #141414}.time{width:48px;font-size:12px;color:#888}.teams{flex:1;font-size:13px}.score{width:55px;text-align:right;font-weight:800}
</style></head><body>
<div class="top" id="dateHead">France 2026-10-17</div>
<div class="tabs" id="dayTabs"></div>
<div class="filters"><button class="f active" data-f="all" onclick="setFilter('all')">All</button><button class="f" data-f="live" onclick="setFilter('live')">Live</button><button class="f" data-f="finished" onclick="setFilter('finished')">Finished</button><button class="f" data-f="scheduled" onclick="setFilter('scheduled')">Scheduled</button><button class="f" onclick="loadMatches(currentDate)">↻</button></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Search..." oninput="render()"></div>
<div id="list"></div>
<script>
function getFranceDateISO(o=0){const d=new Date();const fr=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);let dd=new Date(fr+'T12:00:00');dd.setDate(dd.getDate()+o);return dd.toISOString().split('T')[0];}
let currentDate=getFranceDateISO(0),allMatches=[],currentFilter='all';
function buildTabs(){const c=document.getElementById('dayTabs');let h='';for(let i=-2;i<=2;i++){let iso=getFranceDateISO(i);let label=i===0?'Today':i===-1?'Yesterday':i===1?'Tomorrow':iso.slice(5);h+=`<button class="tab ${iso===currentDate?'active':''}" onclick="pickDate('${iso}')">${label}</button>`;}c.innerHTML=h;document.getElementById('dateHead').innerText='France '+currentDate;}
function pickDate(iso){currentDate=iso;buildTabs();loadMatches(iso);}function setFilter(f){currentFilter=f;document.querySelectorAll('.f').forEach(b=>b.classList.toggle('active',b.dataset.f===f));render();}
function toFranceTime(t){if(!t||!t.includes(':')) return t||'00:00';const p=t.split(':');let h=parseInt(p[0],10),m=parseInt(p[1],10);h=(h+2)%24;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
function getScore(m){const st=m.status||{};let hs=m.home?.score,as=m.away?.score;const ok=hs!=null&&as!=null&&String(hs)!=='';if(ok){return {s:`${hs} - ${as}`,t:st.display||'FT',live:st.is_live,ok:true};}return {s:'-',t:toFranceTime(m.kickoff||''),ok:true};}
function getLeague(m){const L=m.League||{};let c=(L.country||'WORLD').toString();let n=(L.name||'LEAGUE').toString();return {country:c,name:n,key:`${c.toUpperCase()}: ${n.toUpperCase()}` };}
function getTop10(k){const s=k.toUpperCase();if(s.includes('CAF')&&s.includes('CHAMPIONS')) return 100;if(s.includes('NORWAY')&&s.includes('U19')) return 100;if(s.includes('EUROPE:')&&s.includes('CHAMPIONS LEAGUE')) return 1;if(s.includes('EUROPE:')&&s.includes('EUROPA LEAGUE')&&!s.includes('CONFERENCE')) return 2;if(s.includes('EUROPE:')&&s.includes('CONFERENCE LEAGUE')) return 3;if(s==='ENGLAND: PREMIER LEAGUE') return 4;if(s==='FRANCE: LIGUE 1') return 5;if(s==='GERMANY: BUNDESLIGA') return 6;if(s==='ITALY: SERIE A') return 7;if(s.includes('SPAIN: LALIGA')||s==='SPAIN: LA LIGA') return 8;if(s==='NETHERLANDS: EREDIVISIE') return 9;if(s.includes('PORTUGAL: PRIMEIRA')||s.includes('PORTUGAL: LIGA')) return 10;return 100;}
async function loadMatches(date){document.getElementById('list').innerHTML=`<div style="text-align:center;padding:30px;color:#666">Loading ${date}...</div>`;try{const r=await fetch(`/api/matches?date=${date}`);const d=await r.json();allMatches=d.data?.matches||[];render();}catch(e){document.getElementById('list').innerHTML='Error '+e.message;}}
function render(){const q=document.getElementById('q').value.toLowerCase();let filt=allMatches.filter(m=>{const L=getLeague(m);if(q){const t=`${L.country} ${L.name} ${m.home?.name||''} ${m.away?.name||''}`.toLowerCase();if(!t.includes(q))return false;}return true;});const groups={};filt.forEach(m=>{const L=getLeague(m);if(!groups[L.key])groups[L.key]={country:L.country,name:L.name,key:L.key,p:getTop10(L.key),matches:[]};groups[L.key].matches.push(m);});const sorted=Object.values(groups).sort((a,b)=>a.p!==b.p?a.p-b.p:a.key.localeCompare(b.key));document.getElementById('list').innerHTML=sorted.map(g=>`<div class="league-head"><div class="l"><span class="country">${g.country.toUpperCase()}</span>: <span class="lname">${g.name.toUpperCase()}</span></div><span class="stand">Standings</span></div>${g.matches.map(m=>{const gs=getScore(m);return `<div class="match-row"><div class="time">${gs.t}</div><div class="teams"><div>${m.home?.name}</div><div>${m.away?.name}</div></div><div class="score">${gs.s}</div></div>`}).join('')}`).join('');}
buildTabs();loadMatches(currentDate);
</script></body></html>
