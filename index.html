<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveScore 2026 Real</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0e1117;color:#fff;font-family:system-ui}.top{padding:12px 16px;position:sticky;top:0;background:#0e1117;border-bottom:1px solid #1f242f}.tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;position:sticky;top:53px;background:#0e1117;z-index:9}.tab{white-space:nowrap;padding:8px 18px;border-radius:20px;background:#1e222b;color:#8b8f99;border:none;font-weight:700;cursor:pointer}.tab.active{background:#1fd464;color:#000}.filters{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}.f{padding:7px 14px;border-radius:8px;background:#1e222b;color:#8b8f99;border:1px solid #2a303f;font-weight:700;cursor:pointer;white-space:nowrap}.f.active{background:#fff;color:#000}.search{margin:8px 16px;background:#1a1f2b;border-radius:10px;display:flex;padding:10px 14px;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.league-head{background:#151a25;padding:11px 16px;display:flex;justify-content:space-between;border-top:1px solid #1f242f}.l{font-size:12px;font-weight:800}.country{color:#fff}.lname{color:#1fd464}.match-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1f2b}.time{width:80px;font-size:12px;color:#8b8f99;font-weight:800}.time.live{color:#ff3b30}.teams{flex:1;font-size:14px}.score{width:80px;text-align:right;font-weight:900}.score.live{color:#1fd464}.dot{width:6px;height:6px;background:#ff3b30;border-radius:50%;display:inline-block;margin-right:4px;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}</style></head><body>
<div class="top"><b id="dateHead"></b><small style="color:#8b8f99;margin-left:8px">Real API - 236 credits</small></div><div class="tabs" id="dayTabs"></div><div class="filters"><button class="f active" data-f="all" onclick="setFilter('all')">All</button><button class="f" data-f="live" onclick="setFilter('live')">Live</button><button class="f" data-f="finished" onclick="setFilter('finished')">Finished</button><button class="f" data-f="scheduled" onclick="setFilter('scheduled')">Scheduled</button><button class="f" onclick="loadMatches(currentDate)">↻</button></div><div class="search"><span>🔍</span><input id="q" placeholder="Search..." oninput="render()"></div><div id="list"></div>
<script>
function getFranceDateISO(o=0){const now=new Date();const fr=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);let d=new Date(fr+'T12:00:00');d.setDate(d.getDate()+o);return d.toISOString().split('T')[0];}
let currentDate=getFranceDateISO(0),allMatches=[],currentFilter='all';
function buildTabs(){const c=document.getElementById('dayTabs');let h='';for(let i=-2;i<=2;i++){let iso=getFranceDateISO(i);let label=i===0?'Today':i===-1?'Yesterday':i===1?'Tomorrow':iso;h+=`<button class="tab ${iso===currentDate?'active':''}" onclick="pickDate('${iso}')">${label}</button>`;}c.innerHTML=h;document.getElementById('dateHead').innerText='France '+currentDate;}
function pickDate(iso){currentDate=iso;buildTabs();loadMatches(iso);}function setFilter(f){currentFilter=f;document.querySelectorAll('.f').forEach(b=>b.classList.toggle('active',b.dataset.f===f));render();}
function getScore(m){
  const stObj=m.status||{}; const display=(stObj.display||'').toString(); const isLive=stObj.is_live===true || (stObj.status||'').toLowerCase().includes('live');
  let hs=m.home?.score, as=m.away?.score;
  if(hs!==undefined && as!==undefined){
    if(display==='FT'||stObj.status==='finished') return {s:`${hs} - ${as}`,t:'FT',live:false,fin:true};
    if(isLive) return {s:`${hs} - ${as}`,t:display||'LIVE',live:true,fin:false};
    return {s:`${hs} - ${as}`,t:'FT',live:false,fin:true};
  }
  return {s:'-',t:display==='FT'?'FT':(isLive?display:''),live:isLive,fin:display==='FT'};
}
async function loadMatches(date){document.getElementById('list').innerHTML=`<div style="text-align:center;padding:30px;color:#8b8f99">Loading ${date}...</div>`;try{const r=await fetch(`/api/matches?date=${date}`);const d=await r.json();allMatches=d.data?.matches||[];render();}catch(e){document.getElementById('list').innerHTML='Error '+e.message;}}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let filt=allMatches.filter(m=>{const gs=getScore(m);if(currentFilter==='live'&&!gs.live)return false;if(currentFilter==='finished'&&!gs.fin)return false;if(currentFilter==='scheduled'&&(gs.live||gs.fin))return false;if(q){const txt=`${m.League?.name||''} ${m.League?.country||''} ${m.home?.name||''} ${m.away?.name||''}`.toLowerCase();if(!txt.includes(q))return false;}return true;});
  const groups={};filt.forEach(m=>{const L=m.League||{};const key=`${(L.country||'World').toUpperCase()}: ${(L.name||'League').toUpperCase()}`;if(!groups[key]) groups[key]={country:L.country||'World',lname:L.name||'League',key,matches:[]};groups[key].matches.push(m);});
  const sorted=Object.values(groups).sort((a,b)=>a.key.localeCompare(b.key));
  const list=document.getElementById('list');
  if(!filt.length){list.innerHTML=`<div style="text-align:center;padding:30px;color:#8b8f99">No ${currentFilter} for ${currentDate}<br>Total: ${allMatches.length}</div>`;return;}
  list.innerHTML=sorted.map(g=>`<div class="league-head"><div class="l"><span class="country">${g.country.toUpperCase()}</span>: <span class="lname">${g.lname.toUpperCase()}</span></div><span>Standings</span></div>${g.matches.map(m=>{const gs=getScore(m);return `<div class="match-row"><div class="time ${gs.live?'live':''}">${gs.live?'<span class="dot"></span>':''}${gs.t||m.kickoff||''}</div><div class="teams"><div>${m.home?.name||'Home'}</div><div>${m.away?.name||'Away'}</div></div><div class="score ${gs.live?'live':''}">${gs.s}</div></div>`;}).join('')}`).join('');
}
buildTabs();loadMatches(currentDate);
</script></body></html>
